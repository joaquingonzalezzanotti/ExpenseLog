<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/fa.min.css">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/pwa/icon-192.png">
    <link rel="stylesheet" href="/style.css">
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'system';
            if (theme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            } else if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>
    <title>Panel ExpenseLog</title>
    <script src="/chart.min.js"></script>
</head>
<body>
    <div id="liquidityAlertWidget" class="liquidity-alert" style="display: none;">
        <button id="liquidityAlertToggle" class="liquidity-alert-toggle" type="button" aria-label="Alertas de liquidez">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span id="liquidityAlertCount" class="liquidity-alert-count">0</span>
        </button>
        <div id="liquidityAlertPanel" class="liquidity-alert-panel" style="display: none;">
            <div id="liquidityAlertTitle" class="liquidity-alert-title">Riesgo de saldo</div>
            <div id="liquidityAlertSummary" class="liquidity-alert-summary"></div>
            <div id="liquidityAlertList" class="liquidity-alert-list"></div>
        </div>
    </div>
    <div class="container">
        <header>
            <div class="nav-bar">
                <a href="/app">
                    <img src="/pwa/icon-192.png" alt="ExpenseLog Logo" class="nav-logo">
                </a>
                <a href="/app" class="view-button active" data-tooltip="Panel">
                    <i class="fa-solid fa-chart-pie"></i>
                </a>
                <a href="/table" class="view-button" data-tooltip="Tabla">
                    <i class="fa-solid fa-table"></i>
                </a>
                <a href="/settings" class="view-button" data-tooltip="Configuracion">
                    <i class="fa-solid fa-gear"></i>
                </a>
                <button id="logoutButton" class="view-button" data-tooltip="Salir" type="button">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </header>

        <div class="month-navigation">
            <button id="prevMonth" class="nav-button"><i class="fa-solid fa-arrow-left"></i></button>
            <div class="current-month" id="currentMonth"></div>
            <span id="periodModeBadge" class="period-mode-badge" style="display: none;">Proyeccion</span>
            <button id="nextMonth" class="nav-button"><i class="fa-solid fa-arrow-right"></i></button>
        </div>

        <div class="table-controls">
            <div class="quick-actions">
                <button id="toggleExpenseFormBtn" class="quick-action" data-action="open-form">Agregar gasto</button>
                <button class="quick-action" data-action="income">Ingreso</button>
                <button class="quick-action" data-action="card-expense">Gasto Tarjeta</button>
            </div>
        </div>

        <div id="baseSummary" class="cashflow-container"></div>

        <div id="addExpenseContainer" style="display: none;">
            <div class="form-container">
                <form id="expenseForm" class="expense-form">
                    <div class="form-group">
                        <label for="name">Nombre</label>
                        <input type="text" id="name" placeholder="Ej. Supermercado" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="category">Categoria</label>
                        <select id="category" required>
                            <option value="">categorias</option>
                        </select>
                    </div>
    
                    <div class="form-group">
                        <label for="tags-input">Etiquetas</label>
                        <div id="tags-input-container" class="tags-input-container">
                            <div id="selected-tags" class="selected-tags"></div>
                            <input type="text" id="tags-input" placeholder="(opcional)">
                        </div>
                        <div id="tags-dropdown" class="tags-dropdown"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="amount">Monto</label>
                        <input type="number" id="amount" step="0.01" min="0.01" max="9000000000000000" required>
                    </div>

                    <div class="form-group">
                        <label for="currencySelectForm">Moneda</label>
                        <select id="currencySelectForm" required></select>
                    </div>
                    
                    <div class="form-group">
                        <label for="sourceSelect">Metodo</label>
                        <select id="sourceSelect">
                            <option value="CA">CA</option>
                            <option value="EFECTIVO">Efectivo</option>
                            <option value="TARJETA">Tarjeta</option>
                        </select>
                    </div>

                    <div class="form-group" id="cardGroup" style="display:none;">
                        <label for="cardInput">Tarjeta</label>
                        <input type="text" id="cardInput" placeholder="Ej: Visa, Amex">
                        <div id="cardError" class="form-error"></div>
                    </div>

                    <div class="form-group">
                        <label for="date">Fecha</label>
                        <input type="date" id="date" required>
                        <script>
                            const today = new Date();
                            const year = today.getFullYear();
                            const month = String(today.getMonth() + 1).padStart(2, '0');
                            const day = String(today.getDate()).padStart(2, '0');
                            const formattedDate = `${year}-${month}-${day}`;
                            document.getElementById('date').value = formattedDate;
                        </script>
                    </div>
                    
                    <button type="submit" class="nav-button button-primary">Agregar gasto</button>
                </form>
                <div id="formMessage" class="form-message"></div>
            </div>
        </div>

        <div id="recentMovements" class="recent-movements" style="display: none;">
            <h3>Ultimos 3 movimientos</h3>
            <div id="recentList" class="recent-list"></div>
        </div>

        <div class="panel-filters home-filters">
            <div class="filter-group">
                <span class="filter-label">Moneda</span>
                <select id="filterCurrency" class="filter-select">
                    <option value="all">Todas</option>
                </select>
            </div>
            <div class="filter-group">
                <span class="filter-label">Medio de pago</span>
                <select id="filterSource" class="filter-select">
                    <option value="all">Todos</option>
                </select>
            </div>
            <button id="clearFilters" class="nav-button button-secondary">Limpiar</button>
            <button id="toggleChart" class="nav-button button-primary" style="display: none;">Ver grafico</button>
        </div>

        <div id="emptyStateBanner" class="empty-state" style="display: none;"></div>

        <div class="chart-container">
            <div id="noDataMessage" class="empty-state" style="display: none;">
                <strong>Aun no hay gastos.</strong> Carga el primero con + Agregar gasto.
            </div>
            <div class="chart-box">
                <canvas id="categoryPieChart"></canvas>
            </div>
            <div class="legend-box" id="customLegend">
            </div>
        </div>

        <div id="cashflow-section" class="cashflow-container"></div>
    </div>
    <div id="toastContainer" class="toast-container"></div>

    <div id="authOverlay" class="auth-overlay hidden" aria-hidden="true">
        <div class="auth-panel">

                <h2>ExpenseLog</h2>
                <p>Inicia sesion para continuar</p>
            </div>
            <div class="auth-tabs">
                <button class="auth-tab active" type="button" data-auth-tab="login">Ingresar</button>

            <a id="authGoogleButton" class="auth-google-button" href="/auth/google">

                        <path fill="#4285F4" d="M9 18c2.43 0 4.4673-.8059 5.9563-2.1791l-2.9086-2.2581c-.806 0-1.5427.2728-2.1845.4636-1.26 0-2.3264-.8509-2.7096-1.9954H4.1455v2.3218C5.6264 16.9845 7.1309 18 9 18z"/>
                        <path fill="#FBBC05" d="M4.1455 12.0309C3.9482 11.4409 3.8364 10.8091 3.8364 10.1591s.1118-1.2818.3091-1.8718V5.9655H1.2373C.4482 7.5373 0 9.2582 0 10.1591s.4482 2.6218 1.2373 4.1936l2.9082-2.3218z"/>
                        <path fill="#34A853" d="M9 3.5791c1.3214 0 2.5077.4545 3.4418 1.3454l2.5818-2.5818C13.4636.891 11.4264 0 9 0 7.1309 0 5.6264 1.0155 4.1455 2.6473l3.0082 2.3409C7.5373 3.84 8.6045 3.5791 9 3.5791z"/>
                    </svg>

            <form id="authLoginForm" class="auth-form active" data-auth-form="login">

                    <label for="authLoginEmail">Email</label>
                    <input type="email" id="authLoginEmail" autocomplete="email" required>

                <div class="form-group">
                    <label for="authLoginPassword">Contraseña</label>
                    <input type="password" id="authLoginPassword" autocomplete="current-password" required>

                    <label for="authRegisterPassword">Contraseña (min 8)</label>
                    <input type="password" id="authRegisterPassword" autocomplete="new-password" required>

                <label class="auth-remember">
                    <input type="checkbox" id="authRegisterRemember" class="styled-checkbox">

    <script src="/alerts_ui.js"></script>
    <script src="/functions.js"></script>
    <script>
        let currentCurrency = 'usd';
        let baseCurrency = 'ars';
        let startDate = 1;
        let pieChart = null;
        let currentDate = new Date();
        let allExpenses = [];
        let disabledCategories = new Set();
        let categoryColors = {};
        let allTags = new Set();
        let selectedTags = new Set();
        const supportedCurrencies = Object.keys(currencyBehaviors);
        const sourceSelect = document.getElementById('sourceSelect');
        const cardGroup = document.getElementById('cardGroup');
        let filterCurrency = 'all';
        let filterSource = 'all';
        let categories = [];
        let chartExpanded = false;
        const LIQUIDITY_RULES = Object.freeze({
            currency: 'ars',
            windowDays: 7,
            reappearDays: 1,
        });
        let activeLiquidityRules = { ...LIQUIDITY_RULES };
        const LIQUIDITY_DISMISS_STORAGE_KEY = 'expenselog_liquidity_dismiss_v1';
        const liquidityAlertWidget = document.getElementById('liquidityAlertWidget');
        const liquidityAlertToggle = document.getElementById('liquidityAlertToggle');
        const liquidityAlertPanel = document.getElementById('liquidityAlertPanel');
        const liquidityAlertCount = document.getElementById('liquidityAlertCount');
        const liquidityAlertTitle = document.getElementById('liquidityAlertTitle');
        const liquidityAlertSummary = document.getElementById('liquidityAlertSummary');
        const liquidityAlertList = document.getElementById('liquidityAlertList');
        const liquidityAlertIcon = liquidityAlertToggle ? liquidityAlertToggle.querySelector('i') : null;
        const alertUI = (typeof ExpenseLogAlertUI !== 'undefined') ? ExpenseLogAlertUI : null;
        let latestLiquidityAlertsData = null;
        let quickMovementType = 'expense';
        const CONFIG_CACHE_KEY = 'expenselog_config_cache_v1';
        const CONFIG_CACHE_TTL_MS = 5 * 60 * 1000;

        function readConfigCache() {
            try {
                const raw = localStorage.getItem(CONFIG_CACHE_KEY);
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                if (!parsed || typeof parsed !== 'object') return null;
                if (!parsed.config || typeof parsed.config !== 'object') return null;
                return parsed;
            } catch (error) {
                return null;
            }
        }

        function writeConfigCache(config) {
            try {
                localStorage.setItem(CONFIG_CACHE_KEY, JSON.stringify({
                    cachedAt: Date.now(),
                    config,
                }));
            } catch (error) {
                // ignore cache write failures
            }
        }

        function isConfigCacheFresh(entry) {
            if (!entry || typeof entry.cachedAt !== 'number') return false;
            return (Date.now() - entry.cachedAt) < CONFIG_CACHE_TTL_MS;
        }

        function applyHomeConfig(config) {
            const categorySelect = document.getElementById('category');
            categories = Array.isArray(config?.categories) ? config.categories : [];
            categorySelect.innerHTML = categories.map(cat =>
                `<option value="${cat}">${cat}</option>`
            ).join('');

            currentCurrency = (config?.currency || 'ars').toLowerCase();
            if (!supportedCurrencies.includes(currentCurrency)) {
                currentCurrency = 'ars';
            }
            baseCurrency = currentCurrency;
            startDate = Number(config?.startDate) || 1;
            populateFormCurrency();
            populateFilters();
        }

        function formatCurrencyWithCurrency(amount, currencyCode) {
            const behavior = currencyBehaviors[currencyCode] || currencyBehaviors[currentCurrency] || {symbol:"$",useComma:false,useDecimals:true,useSpace:false,right:false};
            const isNegative = amount < 0;
            const absAmount = Math.abs(amount);
            const options = {
                minimumFractionDigits: behavior.useDecimals ? 2 : 0,
                maximumFractionDigits: behavior.useDecimals ? 2 : 0,
            };
            const formatted = new Intl.NumberFormat(behavior.useComma ? "de-DE" : "en-US", options).format(absAmount);
            const result = behavior.right ? `${formatted}${behavior.useSpace ? " " : ""}${behavior.symbol}` : `${behavior.symbol}${behavior.useSpace ? " " : ""}${formatted}`;
            return isNegative ? `-${result}` : result;
        }

        function formatAlertDueDate(isoDate) {
            const ymd = getDateInputValueFromISO(isoDate);
            if (!ymd) return '-';
            const [year, month, day] = ymd.split('-');
            return `${day}/${month}/${year}`;
        }

        function formatDaysUntil(daysUntil) {
            if (daysUntil < 0) {
                const ago = Math.abs(daysUntil);
                return ago === 1 ? 'hace 1 dia' : `hace ${ago} dias`;
            }
            if (daysUntil === 0) return 'hoy';
            if (daysUntil === 1) return 'en 1 dia';
            return `en ${daysUntil} dias`;
        }

        function readLiquidityDismissMap() {
            try {
                const raw = localStorage.getItem(LIQUIDITY_DISMISS_STORAGE_KEY);
                if (!raw) return {};
                const parsed = JSON.parse(raw);
                if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
                    return {};
                }
                return parsed;
            } catch (error) {
                console.warn('No se pudo leer el estado de notificaciones borradas:', error);
                return {};
            }
        }

        function writeLiquidityDismissMap(dismissMap) {
            try {
                localStorage.setItem(LIQUIDITY_DISMISS_STORAGE_KEY, JSON.stringify(dismissMap));
            } catch (error) {
                console.warn('No se pudo guardar el estado de notificaciones borradas:', error);
            }
        }

        function buildLiquidityAlertKey(item) {
            if (alertUI && typeof alertUI.buildLiquidityAlertKey === 'function') {
                return alertUI.buildLiquidityAlertKey(item);
            }
            const recurringId = String(item?.recurringId || 'sin-recurring');
            const dueDate = String(item?.dueDate || '');
            const kind = String(item?.kind || 'preview_7d');
            return `${recurringId}|${dueDate}|${kind}`;
        }

        function getLiquidityRules(data) {
            const reappearDays = Number(data?.reappearDays);
            const windowDays = Number(data?.windowDays);
            const next = {
                currency: activeLiquidityRules.currency || LIQUIDITY_RULES.currency,
                reappearDays: Number.isFinite(reappearDays) ? reappearDays : activeLiquidityRules.reappearDays,
                windowDays: Number.isFinite(windowDays) ? windowDays : activeLiquidityRules.windowDays,
            };
            activeLiquidityRules = next;
            return next;
        }

        function shouldHideDismissedAlert(item, dismissMap, reappearDays) {
            if (alertUI && typeof alertUI.shouldHideDismissedAlert === 'function') {
                return alertUI.shouldHideDismissedAlert(item, dismissMap, reappearDays);
            }
            const key = buildLiquidityAlertKey(item);
            const entry = dismissMap[key];
            if (!entry) return false;
            const daysUntil = Number(item?.daysUntil || 0);
            const dismissedDaysUntil = typeof entry === 'object'
                ? Number(entry.daysUntil ?? Number.POSITIVE_INFINITY)
                : Number.POSITIVE_INFINITY;
            const is24hWindow = daysUntil <= reappearDays;
            const wasDismissedBefore24h = dismissedDaysUntil > reappearDays;
            if (is24hWindow && wasDismissedBefore24h) {
                return false;
            }
            return true;
        }

        function dismissLiquidityAlert(item) {
            const dismissMap = readLiquidityDismissMap();
            dismissMap[buildLiquidityAlertKey(item)] = {
                dismissedAt: Date.now(),
                daysUntil: Number(item?.daysUntil || 0),
            };
            writeLiquidityDismissMap(dismissMap);
        }

        function liquidityAlertLead(item, rules) {
            const criticalDays = Number(rules?.criticalDays || 4);
            if (item?.kind === 'due') return 'Vencimiento';
            if (item?.kind === 'risk_4d') return `Riesgo en ${criticalDays} dias`;
            if (item?.kind === 'monitor_4d') return `Seguimiento ${criticalDays} dias`;
            return 'Aviso 7 dias';
        }

        function closeLiquidityAlertPanel() {
            if (liquidityAlertPanel) {
                liquidityAlertPanel.style.display = 'none';
            }
        }

        function renderLiquidityAlerts(data) {
            if (!liquidityAlertWidget) return;
            const dismissMap = readLiquidityDismissMap();
            const rules = getLiquidityRules(data);
            rules.criticalDays = Number(data?.criticalDays || 4);

            const panelModel = (alertUI && typeof alertUI.buildPanelModel === 'function')
                ? alertUI.buildPanelModel(data, dismissMap, rules)
                : null;
            const alerts = panelModel ? panelModel.alerts : ((Array.isArray(data?.alerts) ? data.alerts : []).filter(item => !shouldHideDismissedAlert(item, dismissMap, rules.reappearDays)));
            const summary = panelModel ? panelModel.summary : ((alertUI && typeof alertUI.summarizeAlerts === 'function')
                ? alertUI.summarizeAlerts(alerts)
                : {
                    total: alerts.length,
                    criticalCount: alerts.filter(item => item.severity === 'critical').length,
                    infoCount: alerts.filter(item => item.severity !== 'critical').length,
                    panelSeverity: alerts.some(item => item.severity === 'critical') ? 'critical' : 'info',
                });
            const hasCritical = panelModel ? (panelModel.summary.panelSeverity === 'critical') : (summary.panelSeverity === 'critical');

            if (alerts.length === 0) {
                liquidityAlertWidget.style.display = 'none';
                liquidityAlertWidget.dataset.severity = 'none';
                closeLiquidityAlertPanel();
                return;
            }

            const criticalCount = summary.criticalCount;
            const infoCount = summary.infoCount;
            liquidityAlertWidget.style.display = 'block';
            liquidityAlertWidget.dataset.severity = hasCritical ? 'critical' : 'info';
            liquidityAlertCount.textContent = String(alerts.length);
            if (liquidityAlertTitle) {
                liquidityAlertTitle.textContent = panelModel ? panelModel.title : (hasCritical ? 'Riesgo de saldo' : 'Notificaciones de saldo');
            }
            if (liquidityAlertIcon) {
                const iconClass = panelModel
                    ? (panelModel.icon === 'warning' ? 'fa-solid fa-triangle-exclamation' : 'fa-solid fa-bell')
                    : (hasCritical ? 'fa-solid fa-triangle-exclamation' : 'fa-solid fa-bell');
                liquidityAlertIcon.className = iconClass;
            }
            const balanceNow = Number(data?.balanceNow || 0);
            const windowDays = Number(data?.windowDays || rules.windowDays);
            const currencyLabel = rules.currency.toUpperCase();
            if (hasCritical) {
                liquidityAlertSummary.textContent = `Saldo ${currencyLabel} actual: ${formatCurrencyWithCurrency(balanceNow, rules.currency)}. ${criticalCount} alerta(s) critica(s) en ${windowDays} dias.`;
            } else {
                liquidityAlertSummary.textContent = `Saldo ${currencyLabel} actual: ${formatCurrencyWithCurrency(balanceNow, rules.currency)}. ${infoCount} notificacion(es) en ${windowDays} dias.`;
            }

            liquidityAlertList.innerHTML = alerts.map((item, index) => {
                const requiredAmount = Number(item.requiredAmount || 0);
                const projectedAfter = Number(item.balanceAfter || 0);
                const shortfall = Number(item.shortfall || 0);
                const dueDate = formatAlertDueDate(item.dueDate);
                const daysText = formatDaysUntil(Number(item.daysUntil || 0));
                const isCritical = item.severity === 'critical';
                const projectedClass = projectedAfter < 0 ? 'negative' : 'positive';
                return `
                    <div class="liquidity-alert-item liquidity-alert-item-${isCritical ? 'critical' : 'info'}">
                        <div class="liquidity-alert-item-head">
                            <div class="liquidity-alert-item-title">${escapeHTML(item.name || 'Recurrente')}</div>
                            <span class="liquidity-alert-badge ${isCritical ? 'critical' : 'info'}">${isCritical ? 'Alerta' : 'Info'}</span>
                        </div>
                        <div class="liquidity-alert-item-row">
                            <span>${liquidityAlertLead(item, rules)}: ${daysText} (${dueDate})</span>
                            <span>${formatCurrencyWithCurrency(requiredAmount, rules.currency)}</span>
                        </div>
                        <div class="liquidity-alert-item-row">
                            <span>Saldo proyectado luego del egreso</span>
                            <span class="liquidity-alert-balance ${projectedClass}">${formatCurrencyWithCurrency(projectedAfter, rules.currency)}</span>
                        </div>
                        ${isCritical && shortfall > 0 ? `
                        <div class="liquidity-alert-item-row liquidity-alert-shortfall">
                            <span>Faltante estimado</span>
                            <span>${formatCurrencyWithCurrency(shortfall, rules.currency)}</span>
                        </div>` : ''}
                        <div class="liquidity-alert-item-actions">
                            <button type="button" class="liquidity-alert-dismiss" data-alert-index="${index}">Borrar</button>
                        </div>
                    </div>
                `;
            }).join('');

            liquidityAlertList.querySelectorAll('.liquidity-alert-dismiss').forEach(button => {
                button.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const index = Number(button.dataset.alertIndex);
                    if (!Number.isFinite(index)) return;
                    const selected = alerts[index];
                    if (!selected) return;
                    dismissLiquidityAlert(selected);
                    renderLiquidityAlerts(latestLiquidityAlertsData || data);
                });
            });
        }

        async function refreshLiquidityAlert() {
            if (!liquidityAlertWidget) return;
            try {
                const response = await fetch(`/alerts/liquidity?currency=${LIQUIDITY_RULES.currency}`);
                if (!response.ok) throw new Error(`status ${response.status}`);
                const data = await response.json();
                latestLiquidityAlertsData = data;
                renderLiquidityAlerts(data);
            } catch (error) {
                console.error('No se pudieron cargar las alertas de liquidez:', error);
                latestLiquidityAlertsData = null;
                liquidityAlertWidget.style.display = 'none';
                liquidityAlertWidget.dataset.severity = 'none';
                closeLiquidityAlertPanel();
            }
        }

        function assignCategoryColors(categories) {
            categories.forEach((category, index) => {
                if (!categoryColors[category]) {
                    categoryColors[category] = colorPalette[index % colorPalette.length];
                }
            });
        }

        function calculateCategoryBreakdown(expenses) {
            const categoryTotals = {};
            let totalAmount = 0;
            expenses.forEach(exp => {
                if (exp.amount < 0 && !disabledCategories.has(exp.category)) {
                    const amount = Math.abs(exp.amount);
                    categoryTotals[exp.category] = (categoryTotals[exp.category] || 0) + amount;
                    totalAmount += amount;
                }
            });
            return Object.entries(categoryTotals)
                .map(([category, total]) => ({
                    category,
                    total,
                    percentage: totalAmount > 0 ? (total / totalAmount) * 100 : 0
                }))
                .sort((a, b) => b.total - a.total);
        }

        function calculateIncome(expenses) {
            return expenses
                .filter(exp => exp.amount > 0)
                .reduce((sum, exp) => sum + exp.amount, 0);
        }

        function calculateExpenses(expenses) {
            return expenses
                .filter(exp => exp.amount < 0)
                .reduce((sum, exp) => sum + Math.abs(exp.amount), 0);
        }

        function calculateCarryoverByCurrency(expenses, periodStart, cutoffDate) {
            const carryoverExpenses = expenses.filter(exp => {
                const expDate = getComparableExpenseDate(exp);
                const source = (exp.source || '').toUpperCase();
                return expDate < periodStart && expDate <= cutoffDate && (source === '' || source === 'CA');
            });
            return carryoverExpenses.reduce((acc, exp) => {
                const cur = exp.currency || baseCurrency;
                acc[cur] = (acc[cur] || 0) + exp.amount;
                return acc;
            }, {});
        }

        function getVisiblePeriodExpenses(expenses) {
            const monthExpenses = getMonthExpenses(expenses);
            const now = new Date();
            return monthExpenses.filter(exp => getComparableExpenseDate(exp) <= now);
        }

        function updateChartAndLegend() {
            const monthExpensesAll = getVisiblePeriodExpenses(allExpenses);
            const monthExpenses = getFilteredMonthExpenses(monthExpensesAll);
            const monthBounds = getMonthBounds(currentDate);
            const carryoverByCurrency = calculateCarryoverByCurrency(allExpenses, monthBounds.start, new Date());
            const hasCarryover = Object.values(carryoverByCurrency).some(amount => amount !== 0);
            const chartContainer = document.querySelector('.chart-container');
            const chartBox = document.querySelector('.chart-box');
            const legendBox = document.getElementById('customLegend');
            const cashflowSection = document.getElementById('cashflow-section');
            const noDataMessage = document.getElementById('noDataMessage');
            const filtersRow = document.querySelector('.panel-filters');
            const emptyStateBanner = document.getElementById('emptyStateBanner');
            const baseSummary = document.getElementById('baseSummary');
            const toggleChart = document.getElementById('toggleChart');

            const hasTransactions = monthExpensesAll.length > 0;
            const hasBaseExpenses = monthExpensesAll.some(e => (e.currency || baseCurrency) === baseCurrency && e.amount < 0);
            if (!hasTransactions && !hasCarryover) {
                if (pieChart) {
                    pieChart.destroy();
                    pieChart = null;
                }
                chartContainer.style.display = 'none';
                cashflowSection.style.display = 'none';
                baseSummary.style.display = 'none';
                filtersRow.style.display = 'none';
                updateHomeFilterControls(false);
                noDataMessage.style.display = 'none';
                emptyStateBanner.style.display = 'block';
                emptyStateBanner.innerHTML = '<strong>Aun no hay gastos.</strong> Carga el primero con + Agregar gasto.';
                renderCashflowByCurrency([], {});
                renderRecentMovements([]);
                return;
            }

            // Cashflow por moneda (usa todas las monedas)
            renderCashflowByCurrency(monthExpenses, carryoverByCurrency);
            cashflowSection.style.display = cashflowSection.innerHTML.trim() ? 'flex' : 'none';
            baseSummary.style.display = baseSummary.innerHTML.trim() ? 'flex' : 'none';
            noDataMessage.style.display = 'none';
            emptyStateBanner.style.display = 'none';
            renderRecentMovements(monthExpenses);
            filtersRow.style.display = hasBaseExpenses ? '' : 'none';
            toggleChart.style.display = hasBaseExpenses ? 'inline-flex' : 'none';
            toggleChart.textContent = chartExpanded ? 'Ocultar grafico' : 'Ver grafico';
            updateHomeFilterControls(hasBaseExpenses);

            // Grafico solo para moneda base y gastos
            const filteredForChart = monthExpenses.filter(e => e.currency === baseCurrency && e.amount < 0);
            if (filteredForChart.length === 0) {
                if (pieChart) { pieChart.destroy(); pieChart = null; }
                chartContainer.style.display = 'none';
                noDataMessage.style.display = 'none';
                if (hasBaseExpenses) {
                    emptyStateBanner.style.display = 'none';
                } else {
                    emptyStateBanner.style.display = 'block';
                    emptyStateBanner.innerHTML = `<strong>No hay gastos en ${baseCurrency.toUpperCase()}.</strong> Carga el primero con + Agregar gasto.`;
                }
            } else if (!chartExpanded) {
                if (pieChart) { pieChart.destroy(); pieChart = null; }
                chartContainer.style.display = 'none';
            } else {
                chartContainer.style.display = 'flex';
                chartBox.style.display = 'flex';
                legendBox.style.display = 'flex';
                const categoryData = calculateCategoryBreakdown(filteredForChart);
                createPieChart(categoryData);
                updateLegend(categoryData, filteredForChart);
            }
        }

        function renderCashflowByCurrency(expenses, carryoverByCurrency) {
            const container = document.getElementById('cashflow-section');
            const baseContainer = document.getElementById('baseSummary');
            container.innerHTML = '';
            baseContainer.innerHTML = '';
            // Bank balance only: keep CA (or empty legacy source), exclude EFECTIVO/TARJETA.
            const cashflowExpenses = expenses.filter(exp => {
                const source = (exp.source || '').toUpperCase();
                return source === '' || source === 'CA';
            });
            const byCurrency = cashflowExpenses.reduce((acc, exp) => {
                const cur = exp.currency || baseCurrency;
                acc[cur] = acc[cur] || { income: 0, expense: 0 };
                if (exp.amount > 0) acc[cur].income += exp.amount;
                else acc[cur].expense += Math.abs(exp.amount);
                return acc;
            }, {});
            const carryover = carryoverByCurrency || {};

            const baseData = byCurrency[baseCurrency];
            const baseCarryover = carryover[baseCurrency] || 0;
            const baseHasValue = (baseData && (baseData.income !== 0 || baseData.expense !== 0)) || baseCarryover !== 0;
            if (baseHasValue) {
                const baseWrapper = document.createElement('div');
                baseWrapper.className = 'cashflow-row base-currency';
                const baseIncome = baseData ? baseData.income : 0;
                const baseExpense = baseData ? baseData.expense : 0;
                const balance = baseCarryover + baseIncome - baseExpense;
                baseWrapper.innerHTML = `
                    <div class="cashflow-item carryover">
                        <div class="cashflow-label">Saldo inicial (CA) ${baseCurrency.toUpperCase()}</div>
                        <div class="cashflow-value ${baseCarryover >= 0 ? 'positive' : 'negative'}">${formatCurrencyWithCurrency(baseCarryover, baseCurrency)}</div>
                    </div>
                    <div class="cashflow-item income">
                        <div class="cashflow-label">Ingresos ${baseCurrency.toUpperCase()}</div>
                        <div class="cashflow-value">${formatCurrencyWithCurrency(baseIncome, baseCurrency)}</div>
                    </div>
                    <div class="cashflow-item expenses">
                        <div class="cashflow-label">Gastos ${baseCurrency.toUpperCase()}</div>
                        <div class="cashflow-value">${formatCurrencyWithCurrency(baseExpense, baseCurrency)}</div>
                    </div>
                    <div class="cashflow-item balance">
                        <div class="cashflow-label">Balance ${baseCurrency.toUpperCase()}</div>
                        <div class="cashflow-value ${balance >= 0 ? 'positive' : 'negative'}">${formatCurrencyWithCurrency(balance, baseCurrency)}</div>
                    </div>
                `;
                baseContainer.appendChild(baseWrapper);
            }

            // Other currencies as single rows
            supportedCurrencies.filter(cur => cur !== baseCurrency).forEach(cur => {
                const data = byCurrency[cur];
                const carry = carryover[cur] || 0;
                const income = data ? data.income : 0;
                const expense = data ? data.expense : 0;
                const balance = carry + income - expense;
                if (balance === 0 && income === 0 && expense === 0 && carry === 0) return;
                const row = document.createElement('div');
                row.className = 'cashflow-row';
                row.innerHTML = `
                    <div class="cashflow-item balance">
                        <div class="cashflow-label">Balance ${cur.toUpperCase()}</div>
                        <div class="cashflow-value ${balance >=0 ? 'positive' : 'negative'}">${formatCurrencyWithCurrency(balance, cur)}</div>
                        <div class="cashflow-sub">
                            <span>Saldo inicial (CA): ${formatCurrencyWithCurrency(carry, cur)}</span>
                            <span>Ingresos: ${formatCurrencyWithCurrency(income, cur)}</span>
                            <span>Gastos: ${formatCurrencyWithCurrency(expense, cur)}</span>
                        </div>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        function renderRecentMovements(expenses) {
            const container = document.getElementById('recentMovements');
            const list = document.getElementById('recentList');
            const title = container.querySelector('h3');
            const futureView = isFuturePeriodSelected();
            if (title) {
                title.textContent = futureView ? 'Proximos 3 movimientos' : 'Ultimos 3 movimientos';
            }
            const sorted = expenses.slice().sort((a, b) => {
                if (futureView) {
                    return getComparableExpenseDate(a) - getComparableExpenseDate(b);
                }
                return getComparableExpenseDate(b) - getComparableExpenseDate(a);
            });
            const recent = sorted.slice(0, 3);
            if (recent.length === 0) {
                container.style.display = 'none';
                list.innerHTML = '';
                return;
            }
            container.style.display = 'block';
            list.innerHTML = recent.map(item => `
                <div class="recent-item">
                    <span><strong>${escapeHTML(item.name)}</strong> • ${escapeHTML(item.category)}</span>
                    <span>${formatCurrencyWithCurrency(item.amount, item.currency || baseCurrency)}</span>
                </div>
            `).join('');
        }

        function isFuturePeriodSelected() {
            const selectedMonth = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
            const now = new Date();
            const currentMonthStart = new Date(now.getFullYear(), now.getMonth(), 1);
            return selectedMonth > currentMonthStart;
        }

        function updatePeriodModeBadge() {
            const badge = document.getElementById('periodModeBadge');
            if (!badge) return;
            const isFuture = isFuturePeriodSelected();
            badge.style.display = isFuture ? 'inline-flex' : 'none';
        }

        function createPieChart(categoryData) {
            if (pieChart) pieChart.destroy();
            pieChart = new Chart('categoryPieChart', {
                type: 'doughnut',
                data: {
                    labels: categoryData.map(c => c.category),
                    datasets: [{
                        data: categoryData.map(c => c.total),
                        backgroundColor: categoryData.map(c => categoryColors[c.category]),
                        borderColor: '#1a1a1a',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: (context) => {
                                    const value = context.raw;
                                    const total = context.dataset.data.reduce((sum, val) => sum + val, 0);
                                    const percentage = total > 0 ? ((value / total) * 100).toFixed(1) : 0;
                                    return `${context.label}: ${formatCurrencyWithCurrency(value, baseCurrency)} (${percentage}%)`;
                                }
                            }
                        }
                    }
                }
            });
        }

        function updateLegend(categoryData, filteredChartExpenses) {
            const legendContainer = document.getElementById('customLegend');
            legendContainer.innerHTML = '';
            const sourceExpenses = Array.isArray(filteredChartExpenses) ? filteredChartExpenses : [];
            const currentMonthCategories = [...new Set(sourceExpenses
                .filter(exp => exp.amount < 0)
                .map(exp => exp.category))];
            const categoryMap = new Map(categoryData.map(cat => [cat.category, cat]));
            
            currentMonthCategories.sort((a, b) => {
                const dataA = categoryMap.get(a);
                const dataB = categoryMap.get(b);
                if (dataA && dataB) return dataB.total - dataA.total;
                if (dataA) return -1;
                if (dataB) return 1;
                return a.localeCompare(b);
            }).forEach(category => {
                const item = document.createElement('div');
                item.className = `legend-item${disabledCategories.has(category) ? ' disabled' : ''}`;
                const color = categoryColors[category];
                const categoryDataItem = categoryMap.get(category);
                const percentage = categoryDataItem ? ` (${categoryDataItem.percentage.toFixed(1)}%)` : '';
                const amount = categoryDataItem ? formatCurrencyWithCurrency(categoryDataItem.total, baseCurrency) : '';
                item.innerHTML = `
                    <div class="color-box" style="background-color: ${color}"></div>
                    <div class="legend-text">
                        <span>${category}${percentage}</span>
                        <span class="amount">${amount}</span>
                    </div>
                `;
                item.addEventListener('click', () => toggleCategory(category));
                legendContainer.appendChild(item);
            });

            const activeTotalExpenses = sourceExpenses
                .filter(exp => exp.amount < 0 && !disabledCategories.has(exp.category))
                .reduce((sum, exp) => sum + Math.abs(exp.amount), 0);

            const totalsHtml = `
                <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border);">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span>Total:</span>
                        <span class="amount">
                            ${formatCurrencyWithCurrency(activeTotalExpenses, baseCurrency)}
                        </span>
                    </div>
                </div>
            `;
            legendContainer.insertAdjacentHTML('beforeend', totalsHtml);
        }

        function updateHomeFilterControls(hasBaseExpenses = true) {
            const clearBtn = document.getElementById('clearFilters');
            const filtersRow = document.querySelector('.home-filters');
            if (!clearBtn) return;
            const hasFilters = filterCurrency !== 'all' || filterSource !== 'all';
            clearBtn.style.display = (hasBaseExpenses && hasFilters) ? 'inline-flex' : 'none';
            clearBtn.disabled = !hasFilters;
            if (filtersRow) {
                filtersRow.classList.toggle('has-clear', hasBaseExpenses && hasFilters);
            }
        }

        function toggleCategory(category) {
            if (disabledCategories.has(category)) {
                disabledCategories.delete(category);
            } else {
                disabledCategories.add(category);
            }
            updateChartAndLegend();
        }

        async function initialize() {
            try {
                const cachedConfigEntry = readConfigCache();
                const cachedConfig = cachedConfigEntry?.config || null;
                if (cachedConfig) {
                    applyHomeConfig(cachedConfig);
                }

                if (!cachedConfig || !isConfigCacheFresh(cachedConfigEntry)) {
                    try {
                        const configResponse = await fetch('/config');
                        if (!configResponse.ok) throw new Error('No se pudo obtener la configuracion');
                        const config = await configResponse.json();
                        applyHomeConfig(config);
                        writeConfigCache(config);
                    } catch (configError) {
                        if (!cachedConfig) throw configError;
                    }
                }

                const response = await fetch('/expenses');
                if (!response.ok) throw new Error('No se pudieron obtener los datos');
                const data = await response.json();
                allExpenses = Array.isArray(data) ? data : (data && Array.isArray(data.expenses) ? data.expenses : []);
                allExpenses = allExpenses.map(exp => ({
                    ...exp,
                    currency: exp.currency || baseCurrency,
                    source: exp.source || '',
                    card: exp.card || '',
                }));

                allTags.clear();
                allExpenses.forEach(exp => {
                    if (exp.tags) {
                        exp.tags.forEach(tag => allTags.add(tag));
                    }
                });
                
                const uniqueCategories = [...new Set(allExpenses.map(exp => exp.category))];
                assignCategoryColors(uniqueCategories);
                updateMonthDisplay();
                updatePeriodModeBadge();
                updateChartAndLegend();
                setupTagInput();
                await refreshLiquidityAlert();
            } catch (error) {
                console.error('No se pudo inicializar el panel:', error);
            }
        }

        Chart.defaults.color = '#b3b3b3';
        Chart.defaults.borderColor = '#606060';
        Chart.defaults.font.family = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';

        function setupTagInput() {
            const container = document.getElementById('tags-input-container');
            const input = document.getElementById('tags-input');
            const dropdown = document.getElementById('tags-dropdown');
            const selectedContainer = document.getElementById('selected-tags');
            const formGroup = container.parentElement;

            const addTag = (tag) => {
                tag = tag.trim();
                if (tag && !selectedTags.has(tag)) {
                    selectedTags.add(tag);
                    const pill = document.createElement('div');
                    pill.className = 'tag-pill';
                    pill.textContent = tag;
                    const removeBtn = document.createElement('span');
                    removeBtn.className = 'remove-tag';
                    removeBtn.textContent = "x";
                    removeBtn.onclick = () => {
                        selectedTags.delete(tag);
                        pill.remove();
                    };
                    pill.appendChild(removeBtn);
                    selectedContainer.appendChild(pill);
                }
                input.value = '';
                dropdown.style.display = 'none';
            };

            input.addEventListener('focus', () => {
                dropdown.innerHTML = '';
                const availableTags = [...allTags].filter(tag => !selectedTags.has(tag));
                if (availableTags.length > 0) {
                    availableTags.forEach(tag => {
                        const item = document.createElement('div');
                        item.textContent = tag;
                        item.onclick = () => addTag(tag);
                        dropdown.appendChild(item);
                    });
                    dropdown.style.display = 'block';
                }
            });

            input.addEventListener('input', () => {
                const value = input.value.trim().toLowerCase();
                dropdown.innerHTML = '';
                const filteredTags = [...allTags].filter(tag => tag.toLowerCase().includes(value) && !selectedTags.has(tag));
                
                if (value && ![...allTags].map(t => t.toLowerCase()).includes(value)) {
                    const newItem = document.createElement('div');
                    newItem.textContent = `+ Agregar "${input.value.trim()}"`;
                    newItem.className = 'new-tag';
                    newItem.onclick = () => addTag(input.value.trim());
                    dropdown.appendChild(newItem);
                }

                filteredTags.forEach(tag => {
                    const item = document.createElement('div');
                    item.textContent = tag;
                    item.onclick = () => addTag(tag);
                    dropdown.appendChild(item);
                });
                
                dropdown.style.display = dropdown.children.length > 0 ? 'block' : 'none';
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (input.value.trim()) {
                        addTag(input.value.trim());
                    }
                }
            });

            container.addEventListener('click', () => input.focus());
            document.addEventListener('click', (e) => {
                if (!formGroup.contains(e.target)) {
                    dropdown.style.display = 'none';
                }
            });
        }

        document.getElementById('prevMonth').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            updateMonthDisplay();
            updatePeriodModeBadge();
            updateChartAndLegend();
        });

        document.getElementById('nextMonth').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            updateMonthDisplay();
            updatePeriodModeBadge();
            updateChartAndLegend();
        });

        function populateFormCurrency() {
            const select = document.getElementById('currencySelectForm');
            select.innerHTML = supportedCurrencies.map(code => `<option value="${code}" ${code === currentCurrency ? 'selected' : ''}>${code.toUpperCase()}</option>`).join('');
        }

        function populateFilters() {
            const currencySelect = document.getElementById('filterCurrency');
            currencySelect.innerHTML = `<option value="all">Todas</option>` + supportedCurrencies.map(code => `<option value="${code}">${code.toUpperCase()}</option>`).join('');
            const sourceFilterSelect = document.getElementById('filterSource');
            sourceFilterSelect.innerHTML = `
                <option value="all">Todos</option>
                <option value="CA">CA</option>
                <option value="EFECTIVO">Efectivo</option>
                <option value="TARJETA">Tarjeta</option>
            `;
            updateHomeFilterControls();
        }
        function getFilteredMonthExpenses(periodExpenses) {
            const monthExpenses = Array.isArray(periodExpenses) ? periodExpenses : getVisiblePeriodExpenses(allExpenses);
            return monthExpenses.filter(exp => {
                const currencyMatch = filterCurrency === 'all' || (exp.currency || baseCurrency) === filterCurrency;
                const source = (exp.source || '').toUpperCase();
                const sourceMatch = filterSource === 'all'
                    || (filterSource === 'CA' && (source === '' || source === 'CA'))
                    || source === filterSource;
                return currencyMatch && sourceMatch;
            });
        }

        function toggleCardInput() {
            const source = sourceSelect.value;
            if (source === 'TARJETA') {
                cardGroup.style.display = 'block';
            } else {
                cardGroup.style.display = 'none';
                document.getElementById('cardInput').value = '';
            }
            document.getElementById('cardError').textContent = '';
        }

        function setExpenseFormVisible(visible) {
            const formContainer = document.getElementById('addExpenseContainer');
            const toggleBtn = document.getElementById('toggleExpenseFormBtn');
            formContainer.style.display = visible ? 'block' : 'none';
            if (toggleBtn) {
                toggleBtn.textContent = visible ? 'Cerrar' : 'Agregar gasto';
            }
        }

        function setQuickMovementType(type) {
            quickMovementType = type === 'income' ? 'income' : 'expense';
        }

        document.getElementById('expenseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const isGain = quickMovementType === 'income';
            let amount = parseFloat(document.getElementById('amount').value);
            if (!isGain) {
                amount *= -1;
            }
            const sourceValue = sourceSelect.value || 'CA';
            if (sourceValue === 'TARJETA' && !document.getElementById('cardInput').value.trim()) {
                document.getElementById('cardError').textContent = 'Especifica la tarjeta';
                return;
            }
            const formData = {
                name: document.getElementById('name').value,
                category: document.getElementById('category').value,
                amount: amount,
                date: getISODateWithLocalTime(document.getElementById('date').value),
                tags: Array.from(selectedTags),
                currency: document.getElementById('currencySelectForm').value || currentCurrency,
                source: sourceValue,
                card: sourceValue === 'TARJETA' ? document.getElementById('cardInput').value : '',
            };
            try {
                const response = await fetch('/expense', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                const messageDiv = document.getElementById('formMessage');
                if (response.ok) {
                messageDiv.textContent = '';
                messageDiv.className = 'form-message';
                showToast('Gasto agregado con exito', 'success');
                document.getElementById('expenseForm').reset();
                document.getElementById('selected-tags').innerHTML = '';
                selectedTags.clear();
                populateFormCurrency();
                sourceSelect.value = 'CA';
                setQuickMovementType('expense');
                toggleCardInput();
                setExpenseFormVisible(false);
                await initialize();
                    const today = new Date();
                    const year = today.getFullYear();
                    const month = String(today.getMonth() + 1).padStart(2, '0');
                    const day = String(today.getDate()).padStart(2, '0');
                    document.getElementById('date').value = `${year}-${month}-${day}`;
                } else {
                    const error = await response.json();
                    messageDiv.textContent = '';
                    messageDiv.className = 'form-message';
                    showToast(error.error || 'No se pudo agregar el gasto', 'error');
                }
            } catch (error) {
                console.error('Error adding expense:', error);
                showToast('No se pudo agregar el gasto', 'error');
            }
        });
        document.addEventListener('DOMContentLoaded', guardAppInit(initialize));

        document.getElementById('name').addEventListener('click', (e) => {
            if (e.target.value === '-') {
                e.target.value = '';
            }
        });

        sourceSelect.addEventListener('change', toggleCardInput);
        toggleCardInput();

        document.getElementById('filterCurrency').addEventListener('change', (e) => {
            filterCurrency = e.target.value;
            updateHomeFilterControls();
            updateChartAndLegend();
        });

        document.getElementById('filterSource').addEventListener('change', (e) => {
            filterSource = e.target.value;
            updateHomeFilterControls();
            updateChartAndLegend();
        });

        document.getElementById('clearFilters').addEventListener('click', () => {
            filterCurrency = 'all';
            filterSource = 'all';
            document.getElementById('filterCurrency').value = 'all';
            document.getElementById('filterSource').value = 'all';
            updateHomeFilterControls();
            updateChartAndLegend();
        });

        document.getElementById('toggleChart').addEventListener('click', () => {
            if (!chartExpanded) {
                filterCurrency = 'ars';
                filterSource = 'CA';
                document.getElementById('filterCurrency').value = 'ars';
                document.getElementById('filterSource').value = 'CA';
                updateHomeFilterControls();
            }
            chartExpanded = !chartExpanded;
            updateChartAndLegend();
        });

        if (liquidityAlertToggle) {
            liquidityAlertToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                const isVisible = liquidityAlertPanel.style.display === 'block';
                liquidityAlertPanel.style.display = isVisible ? 'none' : 'block';
            });
        }

        document.addEventListener('click', (e) => {
            if (!liquidityAlertWidget || !liquidityAlertPanel) return;
            if (!liquidityAlertWidget.contains(e.target)) {
                closeLiquidityAlertPanel();
            }
        });

        document.querySelectorAll('.quick-action').forEach(btn => {
            btn.addEventListener('click', () => {
                const formContainer = document.getElementById('addExpenseContainer');
                const action = btn.dataset.action;
                if (action === 'open-form') {
                    const isHidden = formContainer.style.display === 'none' || formContainer.style.display === '';
                    setExpenseFormVisible(isHidden);
                    return;
                }
                setExpenseFormVisible(true);
                if (action === 'income') {
                    setQuickMovementType('income');
                    sourceSelect.value = 'CA';
                } else if (action === 'card-expense') {
                    setQuickMovementType('expense');
                    sourceSelect.value = 'TARJETA';
                }
                toggleCardInput();
                document.getElementById('amount').focus();
            });
        });

        setExpenseFormVisible(false);
    </script>
