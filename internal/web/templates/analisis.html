    <script src="/app/functions.js"></script>
    <script>
        let currentCurrency = 'ars';
        let startDate = 1;
        let currentDate = new Date();
        let allExpenses = [];
        let analyticsCategoryChart = null;
        let analyticsSourceChart = null;
        let filterCurrency = 'all';
        let filterSource = 'all';
        const supportedCurrencies = Object.keys(currencyBehaviors);
        const categoryColors = {};
        const disabledCategories = new Set();

        const CONFIG_CACHE_KEY = 'expenselog_config_cache_v1';
        const CONFIG_CACHE_TTL_MS = 5 * 60 * 1000;

        function readConfigCache() {
            try {
                const raw = localStorage.getItem(CONFIG_CACHE_KEY);
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                if (!parsed || typeof parsed !== 'object') return null;
                if (!parsed.config || typeof parsed.config !== 'object') return null;
                return parsed;
            } catch (_) {
                return null;
            }
        }

        function writeConfigCache(config) {
            try {
                localStorage.setItem(CONFIG_CACHE_KEY, JSON.stringify({
                    cachedAt: Date.now(),
                    config,
                }));
            } catch (_) {
                // ignore cache write failures
            }
        }

        function isConfigCacheFresh(entry) {
            if (!entry || typeof entry.cachedAt !== 'number') return false;
            return (Date.now() - entry.cachedAt) < CONFIG_CACHE_TTL_MS;
        }

        function formatCurrencyWithCurrency(amount, currencyCode) {
            const behavior = currencyBehaviors[currencyCode] || currencyBehaviors[currentCurrency] || {
                symbol: "$",
                useComma: false,
                useDecimals: true,
                useSpace: false,
                right: false,
            };
            const isNegative = amount < 0;
            const absAmount = Math.abs(amount);
            const options = {
                minimumFractionDigits: behavior.useDecimals ? 2 : 0,
                maximumFractionDigits: behavior.useDecimals ? 2 : 0,
            };
            const formatted = new Intl.NumberFormat(behavior.useComma ? "de-DE" : "en-US", options).format(absAmount);
            const result = behavior.right
                ? `${formatted}${behavior.useSpace ? " " : ""}${behavior.symbol}`
                : `${behavior.symbol}${behavior.useSpace ? " " : ""}${formatted}`;
            return isNegative ? `-${result}` : result;
        }

        function assignCategoryColors(categories) {
            categories.forEach((category, index) => {
                if (!categoryColors[category]) {
                    categoryColors[category] = colorPalette[index % colorPalette.length];
                }
            });
        }

        function applyConfig(config) {
            currentCurrency = (config?.currency || 'ars').toLowerCase();
            if (!supportedCurrencies.includes(currentCurrency)) {
                currentCurrency = 'ars';
            }
            startDate = Number(config?.startDate) || 1;
            populateFilters();
        }

        function populateFilters() {
            const currencySelect = document.getElementById('analyticsFilterCurrency');
            const sourceSelect = document.getElementById('analyticsFilterSource');
            if (!currencySelect || !sourceSelect) return;
            currencySelect.innerHTML = `<option value="all">Todas</option>` + supportedCurrencies.map((code) =>
                `<option value="${code}">${code.toUpperCase()}</option>`
            ).join('');
            sourceSelect.innerHTML = `
                <option value="all">Todos</option>
                <option value="CA">${formatSourceLabel('CA')}</option>
                <option value="EFECTIVO">${formatSourceLabel('EFECTIVO')}</option>
                <option value="TARJETA">${formatSourceLabel('TARJETA')}</option>
            `;
            currencySelect.value = filterCurrency;
            sourceSelect.value = filterSource;
        }

        function isExpenseForAnalysis(expense) {
            const flow = resolveFlow(expense);
            return flow === 'expense' && Number(expense.amount) < 0;
        }

        function getCurrentMonthExpenses() {
            const now = new Date();
            return getMonthExpenses(allExpenses).filter((expense) => getComparableExpenseDate(expense) <= now);
        }

        function getFilteredExpenses() {
            const monthExpenses = getCurrentMonthExpenses();
            return monthExpenses.filter((expense) => {
                if (!isExpenseForAnalysis(expense)) return false;
                const currency = (expense.currency || currentCurrency).toLowerCase();
                if (filterCurrency !== 'all' && currency !== filterCurrency) return false;
                const normalizedSource = normalizeSourceCode(expense.source || 'CA');
                if (filterSource === 'all') return true;
                if (filterSource === 'CA') return normalizedSource === 'CA';
                return normalizedSource === filterSource;
            });
        }

        function calculateCategoryBreakdown(expenses) {
            const totals = {};
            expenses.forEach((expense) => {
                const key = String(expense.category || 'Sin categoria');
                totals[key] = (totals[key] || 0) + Math.abs(Number(expense.amount) || 0);
            });
            const entries = Object.entries(totals)
                .map(([category, total]) => ({ category, total }))
                .sort((a, b) => b.total - a.total);
            const grandTotal = entries.reduce((sum, entry) => sum + entry.total, 0);
            return entries.map((entry) => ({
                ...entry,
                percentage: grandTotal > 0 ? (entry.total / grandTotal) * 100 : 0,
            }));
        }

        function calculateSourceBreakdown(expenses) {
            const totals = {};
            expenses.forEach((expense) => {
                const source = normalizeSourceCode(expense.source || 'CA');
                totals[source] = (totals[source] || 0) + Math.abs(Number(expense.amount) || 0);
            });
            const entries = Object.entries(totals)
                .map(([source, total]) => ({ source, total }))
                .sort((a, b) => b.total - a.total);
            const grandTotal = entries.reduce((sum, entry) => sum + entry.total, 0);
            return entries.map((entry) => ({
                ...entry,
                label: formatSourceLabel(entry.source),
                percentage: grandTotal > 0 ? (entry.total / grandTotal) * 100 : 0,
            }));
        }

        function destroyCharts() {
            if (analyticsCategoryChart) {
                analyticsCategoryChart.destroy();
                analyticsCategoryChart = null;
            }
            if (analyticsSourceChart) {
                analyticsSourceChart.destroy();
                analyticsSourceChart = null;
            }
        }

        function renderCategoryLegend(categoryData, currencyCode) {
            const container = document.getElementById('analyticsCategoryLegend');
            if (!container) return;
            container.innerHTML = '';
            categoryData.forEach((entry) => {
                const disabled = disabledCategories.has(entry.category);
                const item = document.createElement('div');
                item.className = `legend-item${disabled ? ' disabled' : ''}`;
                item.innerHTML = `
                    <div class="color-box" style="background-color: ${categoryColors[entry.category] || '#808080'}"></div>
                    <div class="legend-text">
                        <span>${escapeHTML(entry.category)} (${entry.percentage.toFixed(1)}%)</span>
                        <span class="amount">${formatCurrencyWithCurrency(entry.total, currencyCode)}</span>
                    </div>
                `;
                item.addEventListener('click', () => {
                    if (disabledCategories.has(entry.category)) {
                        disabledCategories.delete(entry.category);
                    } else {
                        disabledCategories.add(entry.category);
                    }
                    renderCharts();
                });
                container.appendChild(item);
            });
        }

        function renderSourceLegend(sourceData, currencyCode) {
            const container = document.getElementById('analyticsSourceLegend');
            if (!container) return;
            container.innerHTML = sourceData.map((entry) => `
                <div class="legend-item">
                    <div class="color-box" style="background-color: ${entry.color}"></div>
                    <div class="legend-text">
                        <span>${escapeHTML(entry.label)} (${entry.percentage.toFixed(1)}%)</span>
                        <span class="amount">${formatCurrencyWithCurrency(entry.total, currencyCode)}</span>
                    </div>
                </div>
            `).join('');
        }

        function renderCharts() {
            const emptyState = document.getElementById('analyticsEmptyState');
            const grid = document.getElementById('analyticsGrid');
            const filteredExpenses = getFilteredExpenses();
            const chartCurrency = filterCurrency === 'all' ? currentCurrency : filterCurrency;

            if (!filteredExpenses.length) {
                destroyCharts();
                if (grid) grid.style.display = 'none';
                if (emptyState) {
                    emptyState.style.display = 'block';
                    emptyState.innerHTML = '<strong>No hay gastos para este periodo/filtro.</strong> Cambia mes o filtros para ver datos.';
                }
                return;
            }

            if (grid) grid.style.display = 'grid';
            if (emptyState) emptyState.style.display = 'none';

            const categoryData = calculateCategoryBreakdown(filteredExpenses);
            assignCategoryColors(categoryData.map((entry) => entry.category));
            const activeCategoryData = categoryData.filter((entry) => !disabledCategories.has(entry.category));
            const safeCategoryData = activeCategoryData.length ? activeCategoryData : categoryData;

            const sourceData = calculateSourceBreakdown(filteredExpenses).map((entry, index) => ({
                ...entry,
                color: colorPalette[(index + 3) % colorPalette.length],
            }));

            destroyCharts();

            analyticsCategoryChart = new Chart('analyticsCategoryChart', {
                type: 'doughnut',
                data: {
                    labels: safeCategoryData.map((entry) => entry.category),
                    datasets: [{
                        data: safeCategoryData.map((entry) => entry.total),
                        backgroundColor: safeCategoryData.map((entry) => categoryColors[entry.category]),
                        borderColor: '#1a1a1a',
                        borderWidth: 1,
                    }],
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: (context) => {
                                    const value = Number(context.raw || 0);
                                    const total = context.dataset.data.reduce((sum, item) => sum + Number(item || 0), 0);
                                    const percentage = total > 0 ? ((value / total) * 100).toFixed(1) : '0.0';
                                    return `${context.label}: ${formatCurrencyWithCurrency(value, chartCurrency)} (${percentage}%)`;
                                },
                            },
                        },
                    },
                },
            });

            analyticsSourceChart = new Chart('analyticsSourceChart', {
                type: 'doughnut',
                data: {
                    labels: sourceData.map((entry) => entry.label),
                    datasets: [{
                        data: sourceData.map((entry) => entry.total),
                        backgroundColor: sourceData.map((entry) => entry.color),
                        borderColor: '#1a1a1a',
                        borderWidth: 1,
                    }],
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: (context) => {
                                    const value = Number(context.raw || 0);
                                    const total = context.dataset.data.reduce((sum, item) => sum + Number(item || 0), 0);
                                    const percentage = total > 0 ? ((value / total) * 100).toFixed(1) : '0.0';
                                    return `${context.label}: ${formatCurrencyWithCurrency(value, chartCurrency)} (${percentage}%)`;
                                },
                            },
                        },
                    },
                },
            });

            renderCategoryLegend(categoryData, chartCurrency);
            renderSourceLegend(sourceData, chartCurrency);
        }

        async function initialize() {
            try {
                const cachedConfigEntry = readConfigCache();
                const cachedConfig = cachedConfigEntry?.config || null;
                if (cachedConfig) {
                    applyConfig(cachedConfig);
                }

                if (!cachedConfig || !isConfigCacheFresh(cachedConfigEntry)) {
                    try {
                        const configResponse = await fetch('/config');
                        if (!configResponse.ok) throw new Error('No se pudo obtener la configuracion');
                        const config = await configResponse.json();
                        applyConfig(config);
                        writeConfigCache(config);
                    } catch (configError) {
                        if (!cachedConfig) throw configError;
                    }
                }

                const response = await fetch('/expenses');
                if (!response.ok) throw new Error('No se pudieron obtener los movimientos');
                const data = await response.json();
                allExpenses = Array.isArray(data) ? data : (Array.isArray(data.expenses) ? data.expenses : []);
                allExpenses = allExpenses.map((expense) => ({
                    ...expense,
                    currency: (expense.currency || currentCurrency).toLowerCase(),
                    source: expense.source || 'CA',
                }));

                updateMonthDisplay();
                renderCharts();
            } catch (error) {
                console.error('No se pudo inicializar analisis:', error);
                const emptyState = document.getElementById('analyticsEmptyState');
                if (emptyState) {
                    emptyState.style.display = 'block';
                    emptyState.innerHTML = '<strong>No se pudo cargar Analisis.</strong> Reintenta en unos segundos.';
                }
            }
        }

        if (window.Chart) {
            Chart.defaults.color = '#b3b3b3';
            Chart.defaults.borderColor = '#606060';
            Chart.defaults.font.family = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        }

        document.getElementById('prevMonth')?.addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            updateMonthDisplay();
            renderCharts();
        });

        document.getElementById('nextMonth')?.addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            updateMonthDisplay();
            renderCharts();
        });

        document.getElementById('analyticsFilterCurrency')?.addEventListener('change', (event) => {
            filterCurrency = String(event.target.value || 'all').toLowerCase();
            renderCharts();
        });

        document.getElementById('analyticsFilterSource')?.addEventListener('change', (event) => {
            filterSource = String(event.target.value || 'all').toUpperCase();
            renderCharts();
        });

        document.getElementById('analyticsClearFilters')?.addEventListener('click', () => {
            filterCurrency = 'all';
            filterSource = 'all';
            const currencySelect = document.getElementById('analyticsFilterCurrency');
            const sourceSelect = document.getElementById('analyticsFilterSource');
            if (currencySelect) currencySelect.value = 'all';
            if (sourceSelect) sourceSelect.value = 'all';
            renderCharts();
        });

        document.addEventListener('DOMContentLoaded', guardAppInit(initialize));
    </script>
    <script>
        (function loadVercelTelemetry() {
            const host = window.location.hostname;
            const isVercelHost = host.endsWith('.vercel.app');
            const isPrimaryHost = host === 'expenselog.com.ar' || host === 'www.expenselog.com.ar';
            if (!isVercelHost && !isPrimaryHost) return;

            const addScript = (src) => {
                const script = document.createElement('script');
                script.defer = true;
                script.src = src;
                document.body.appendChild(script);
            };

            addScript('/_vercel/insights/script.js');
            addScript('/_vercel/speed-insights/script.js');
        })();
    </script>
</body>
</html>
