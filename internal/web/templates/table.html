<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/app/fa.min.css">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="/app/favicon.ico" type="image/x-icon">
    <link rel="manifest" href="/app/manifest.json">
    <link rel="apple-touch-icon" href="/app/pwa/icon-192.png">
    <link rel="stylesheet" href="/app/style.css">
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'system';
            if (theme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            } else if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/app/sw.js', { scope: '/app/' });
            });
        }
    </script>
    <title>Tabla ExpenseLog</title>
</head>
<body>
    <div class="container">
        <aside id="app-sidebar">
            <nav class="app-sidebar-nav">
                <a href="/app" class="app-sidebar-link">Inicio</a>
                <a href="/app/table" class="app-sidebar-link">Tabla</a>
                <a href="/app/table?view=calendar" class="app-sidebar-link">Calendario</a>
                <a href="/app/reportes" class="app-sidebar-link">Reportes</a>
                <a href="/app/perfil" class="app-sidebar-link">Usuario</a>
            </nav>
        </aside>
        <div id="sidebar-overlay"></div>
        <main class="main-content">
            <header>
                <div class="nav-bar">
                    <button id="sidebar-toggle" class="view-button" type="button" aria-label="Abrir menu">
                        <i class="fa-solid fa-bars" aria-hidden="true"></i>
                    </button>
                    <a href="/app" class="nav-logo-link">
                        <img src="/app/pwa/icon-192.png" alt="ExpenseLog Logo" class="nav-logo">
                        <span class="nav-logo-mobile-text" aria-hidden="true">EL</span>
                    </a>
                    <div class="nav-right-slot">
                        <button id="notificationCenterButton" class="view-button notification-trigger" data-tooltip="Notificaciones" type="button" aria-label="Notificaciones" aria-expanded="false">
                            <i class="fa-regular fa-bell"></i>
                            <span id="notificationCenterBadge" class="notification-badge" hidden></span>
                        </button>
                        <div id="notificationCenterPanel" class="notification-panel" hidden>
                            <div class="notification-panel-title">Notificaciones 🔔 </div>
                            <div id="notificationCenterList" class="notification-list"></div>
                        </div>
                    </div>
                </div>
            </header>

            <div class="month-navigation">
                <button id="prevMonth" class="nav-button"><span class="month-nav-arrow" aria-hidden="true">&#8592;</span></button>
                <div class="current-month" id="currentMonth"></div>
                <span id="periodModeBadge" class="period-mode-badge" style="display: none;">Proyeccion</span>
                <button id="nextMonth" class="nav-button"><span class="month-nav-arrow" aria-hidden="true">&#8594;</span></button>
            </div>

            <div class="table-view-row">
                <div class="table-view-switch" role="tablist" aria-label="Vista de movimientos">
                    <button id="viewTableBtn" class="table-view-tab active" type="button" role="tab" aria-selected="true">Tabla</button>
                    <button id="viewCalendarBtn" class="table-view-tab" type="button" role="tab" aria-selected="false">Calendario</button>
                </div>
            </div>

            <div id="tableDataModule">
                <div class="table-controls">
                    <button id="toggleTableExpenseFormBtn" class="nav-button button-primary" type="button">
                        <i class="fa-solid fa-plus"></i>
                        <span>Agregar gasto</span>
                    </button>
                </div>
                <div id="tableExpenseFormContainer" class="form-container" data-expanded="false">
                    <form id="expenseForm" class="expense-form table-expense-form"></form>
                </div>
                <h3><i class="fa-solid fa-table-list"></i> Tabla de movimientos</h3>
                <p>Vista detallada de todos tus movimientos.</p>
                <div class="search-bar">
                    <span class="search-icon" aria-hidden="true"><i class="fa-solid fa-magnifying-glass"></i></span>
                    <input type="text" id="tableSearch" placeholder="Buscar movimientos por nombre, categoria o etiquetas">
                    <button id="clearSearch" class="nav-button button-secondary">Limpiar</button>
                </div>
                <div class="panel-filters">
                </div>
                <div id="tableContainer">
                </div>
                <div id="mobileTablePager" class="mobile-table-pager" style="display: none;">
                </div>
                <div class="table-footer-controls">
                </div>
            </div>

            <div id="calendarDataModule" class="financial-calendar-module" hidden>
            </div>
        </main>
    </div>
    <div id="toastContainer" class="toast-container"></div>

    <div id="deleteModal" class="modal">
    </div>

    <div id="authOverlay" class="auth-overlay hidden" aria-hidden="true">
    </div>

    <script src="/app/functions.js"></script>
    <script>
        // JS Logic will be added here
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sidebar = document.getElementById('app-sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            const toggleBtn = document.getElementById('sidebar-toggle');

            if (sidebar && overlay && toggleBtn) {
                toggleBtn.addEventListener('click', () => {
                    sidebar.classList.toggle('open');
                    overlay.classList.toggle('open');
                });

                overlay.addEventListener('click', () => {
                    sidebar.classList.remove('open');
                    overlay.classList.remove('open');
                });
            }
        });
    </script>
</body>
</html>
