<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>ExpenseLog - Preparando acceso</title>
    <style>
        :root {
            --bg: #08101f;
            --bg-card: #0f1a31;
            --text: #e8eef9;
            --muted: #9caecc;
            --accent: #6cb5ff;
            --accent-2: #8bc7ff;
            --border: #243754;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Manrope", "Segoe UI", sans-serif;
            color: var(--text);
            display: grid;
            place-items: center;
            padding: 1rem;
            background:
                radial-gradient(circle at 0% 0%, rgba(108, 181, 255, 0.2), transparent 38%),
                radial-gradient(circle at 100% 0%, rgba(16, 185, 129, 0.14), transparent 33%),
                var(--bg);
        }

        .card {
            width: 100%;
            max-width: 520px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--bg-card);
            box-shadow: 0 20px 44px rgba(0, 0, 0, 0.42);
            padding: 1.25rem;
            text-align: center;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 800;
            margin-bottom: 0.65rem;
        }

        .logo img {
            width: 38px;
            height: 38px;
            border-radius: 10px;
        }

        h1 {
            margin: 0;
            font-size: 1.15rem;
        }

        p {
            margin: 0.7rem 0 0;
            color: var(--muted);
            min-height: 1.3rem;
        }

        .progress {
            margin-top: 1rem;
            width: 100%;
            height: 10px;
            border-radius: 999px;
            border: 1px solid rgba(108, 181, 255, 0.35);
            background: rgba(108, 181, 255, 0.14);
            overflow: hidden;
        }

        .progress span {
            display: block;
            width: 36%;
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            animation: loading 1.1s ease-in-out infinite alternate;
        }

        @keyframes loading {
            from { transform: translateX(-14%); }
            to { transform: translateX(175%); }
        }

        .actions {
            margin-top: 0.95rem;
            display: flex;
            justify-content: center;
            gap: 0.6rem;
        }

        button,
        a {
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 0.62rem 1rem;
            background: #132443;
            color: var(--text);
            text-decoration: none;
            font-weight: 700;
            cursor: pointer;
        }

        a { display: none; }
        a.visible { display: inline-flex; }
    </style>
</head>
<body>
    <main class="card">
        <div class="logo">
            <img src="/app/pwa/icon-192.png" alt="ExpenseLog">
            <span>ExpenseLog</span>
        </div>
        <h1>Estamos preparando el acceso...</h1>
        <p id="hint">Despertando servidor.</p>
        <div class="progress"><span></span></div>
        <div class="actions">
            <button id="retry" type="button">Reintentar</button>
            <a id="openNow" href="/app">Entrar ahora</a>
        </div>
    </main>

    <script>
        (function () {
            const hintEl = document.getElementById('hint');
            const retryBtn = document.getElementById('retry');
            const openNow = document.getElementById('openNow');

            const appURL = '/app';
            const versionURL = '/api/version';
            const authMeURL = '/api/auth/me';

            let startAt = Date.now();
            let timer = null;
            let redirecting = false;

            function setHint(text) {
                if (!hintEl) return;
                hintEl.textContent = text;
            }

            function withTimeout(ms) {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), ms);
                return {
                    signal: controller.signal,
                    clear: function () { clearTimeout(timeout); }
                };
            }

            async function pingBackend() {
                const guard = withTimeout(4500);
                try {
                    const response = await fetch(versionURL, {
                        method: 'GET',
                        cache: 'no-store',
                        credentials: 'include',
                        signal: guard.signal,
                    });
                    return response.ok;
                } catch (_) {
                    return false;
                } finally {
                    guard.clear();
                }
            }

            async function checkSession() {
                const guard = withTimeout(4500);
                try {
                    const response = await fetch(authMeURL, {
                        method: 'GET',
                        cache: 'no-store',
                        credentials: 'include',
                        signal: guard.signal,
                    });
                    return response.ok;
                } catch (_) {
                    return false;
                } finally {
                    guard.clear();
                }
            }

            function goToApp(message) {
                if (redirecting) return;
                redirecting = true;
                setHint(message || 'Listo. Entrando a la app...');
                window.location.assign(appURL);
            }

            async function tick() {
                const ready = await pingBackend();
                if (!ready) {
                    const elapsed = Date.now() - startAt;
                    if (elapsed > 15000) {
                        setHint('Todavia no termino de levantar. Espera unos segundos mas...');
                    }
                    if (elapsed > 35000 && openNow) {
                        openNow.classList.add('visible');
                    }
                    return;
                }

                const hasSession = await checkSession();
                if (hasSession) {
                    goToApp('Sesion detectada. Entrando...');
                    return;
                }
                goToApp('Servidor listo. Entrando...');
            }

            function start() {
                if (timer) {
                    clearInterval(timer);
                }
                startAt = Date.now();
                setHint('Despertando servidor.');
                if (openNow) {
                    openNow.classList.remove('visible');
                }
                tick();
                timer = setInterval(tick, 2000);
            }

            if (retryBtn) {
                retryBtn.addEventListener('click', function () {
                    start();
                });
            }

            window.addEventListener('load', start);
        })();
    </script>
</body>
</html>
