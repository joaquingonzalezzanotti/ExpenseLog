name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: UTF-8 validation
        run: python3 scripts/check_utf8.py

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.9"

      - name: Go tests
        run: go test ./...

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend tests
        run: node --test internal/web/templates/alerts_ui.test.js

      - name: Build binary
        run: go build -o expenselog ./cmd/expenselog
